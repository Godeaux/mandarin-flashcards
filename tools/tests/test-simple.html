<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Module Test</title>
</head>
<body>
  <h1>Testing if modules work</h1>
  <div id="test-output"></div>
  
  <script type="module">
    import { CONFIG } from './js/config.js';
    import { Storage } from './js/storage.js';
    
    document.getElementById('test-output').innerHTML = `
      <p>✅ Config loaded: SERVER_URL = ${CONFIG.SERVER_URL}</p>
      <p>✅ Storage loaded: ${typeof Storage}</p>
    `;
    
    // Test basic storage
    Storage.save('test', {hello: 'world'});
    const result = Storage.load('test');
    document.getElementById('test-output').innerHTML += `<p>✅ Storage works: ${JSON.stringify(result)}</p>`;
  </script>
</body>
</html>
