<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debug Main.js</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="debug">
    <h1>Debugging Main.js</h1>
    <div id="status">Waiting for JavaScript...</div>
    <button id="test-btn">Test Button</button>
  </div>

  <script type="module">
    // Simple test to see if we can get this far
    document.getElementById('status').textContent = 'JavaScript is executing!';
    document.getElementById('test-btn').addEventListener('click', () => {
      document.getElementById('status').textContent = 'Button clicked at ' + new Date().toLocaleTimeString();
    });
    
    // Now try to import and run just a tiny bit of main.js
    try {
      import('./js/main.js').then(module => {
        document.getElementById('status').textContent += ' + main.js module loaded';
        // Try to call the init function if it exists
        if (module.default && typeof module.default.init === 'function') {
          document.getElementById('status').textContent += ' + init function found';
          // Don't actually call it yet - just see if we can get here
        }
      }).catch(err => {
        document.getElementById('status').textContent += ` ❌ main.js load error: ${err.message}`;
        console.error('Main.js load error:', err);
      });
    } catch (e) {
      document.getElementById('status').textContent += ` ❌ Import syntax error: ${e.message}`;
      console.error('Import syntax error:', e);
    }
  </script>
</body>
</html>
