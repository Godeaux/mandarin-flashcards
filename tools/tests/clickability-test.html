<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clickability Test</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="test-output">
    <h1>Clickability Diagnostics</h1>
    <div id="log"></div>
  </div>

  <script type="module">
    const logDiv = document.getElementById('log');
    function log(msg) {
      logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
      console.log(msg);
    }
    
    // Wait for app to load
    setTimeout(async () => {
      try {
        log('Waiting for app to fully load...');
        await new Promise(r => setTimeout(r, 4000)); // Give it extra time
        
        log('Examining theme button for clickability issues...');
        const themeButton = document.getElementById('btn-theme');
        
        if (!themeButton) {
          log('❌ Theme button not found!');
          return;
        }
        
        log('✅ Found theme button: "' + themeButton.textContent + '"');
        
        // Check computed styles that might affect clickability
        const computedStyle = window.getComputedStyle(themeButton);
        log('🔍 Checking computed styles...');
        
        const visibility = computedStyle.visibility;
        const display = computedStyle.display;
        const position = computedStyle.position;
        const zIndex = computedStyle.zIndex;
        const pointerEvents = computedStyle.pointerEvents;
        const opacity = computedStyle.opacity;
        
        log('📊 Visibility: ' + visibility);
        log('📊 Display: ' + display);
        log('📊 Position: ' + position);
        log('📊 Z-index: ' + zIndex);
        log('📊 Pointer events: ' + pointerEvents);
        log('📊 Opacity: ' + opacity);
        
        // Check if any of these would block clicks
        const issues = [];
        if (visibility === 'hidden') issues.push('visibility: hidden');
        if (display === 'none') issues.push('display: none');
        if (pointerEvents === 'none') issues.push('pointer-events: none');
        if (parseFloat(opacity) === 0) issues.push('opacity: 0');
        
        if (issues.length > 0) {
          log('🚨 POTENTIAL CLICK BLOCKERS FOUND:');
          issues.forEach(issue => log('   • ' + issue));
        } else {
          log('✅ No obvious CSS click blockers found');
        }
        
        // Check if element is actually visible and in viewport
        const rect = themeButton.getBoundingClientRect();
        log('📐 Button position:');
        log('   • Top: ' + rect.top + 'px');
        log('   • Left: ' + rect.left + 'px');
        log('   • Width: ' + rect.width + 'px');
        log('   • Height: ' + rect.height + 'px');
        
        const inViewport = (
          rect.top >= 0 &&
          rect.left >= 0 &&
          rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
          rect.right <= (window.innerWidth || document.documentElement.clientWidth)
        );
        
        log('👁️  In viewport: ' + inViewport);
        
        // Try to see if there's an overlay by checking what's at the button's center point
        log('🔍 Checking what element is at button center point...');
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        // Temporarily hide the button to see what's underneath
        const originalVisibility = themeButton.style.visibility;
        themeButton.style.visibility = 'hidden';
        
        const elementAtPoint = document.elementFromPoint(centerX, centerY);
        log('🎯 Element at center point: ' + (elementAtPoint ? elementAtPoint.tagName + '.' + elementAtPoint.className : 'null'));
        
        // Restore button
        themeButton.style.visibility = originalVisibility;
        
        // Final test: try to click it and see if our manually added listener works
        log('🧪 Final test: Adding temporary listener and trying click...');
        let testClickCount = 0;
        const testListener = () => {
          testClickCount++;
          log('🎯 TEST LISTENER FIRED! Count: ' + testClickCount);
        };
        
        themeButton.addEventListener('click', testListener);
        themeButton.click();
        
        setTimeout(() => {
          log('📈 Test click resulted in ' + testClickCount + ' listener firings');
          if (testClickCount > 0) {
            log('✅ BUTTON IS CLICKABLE - The issue is likely in the original event handler');
          } else {
            log('❌ BUTTON APPEARS TO BE NON-CLICKABLE even with our listener');
          }
          
          // Clean up
          themeButton.removeEventListener('click', testListener);
          
        }, 300);
        
      } catch (e) {
        log('💥 Test failed with error: ' + e.message);
        console.error(e);
      }
    }, 4000);
  </script>
</body>
</html>
