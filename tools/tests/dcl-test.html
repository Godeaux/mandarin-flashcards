<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOMContentLoaded Test</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="test">
    <h1>DOMContentLoaded Test</h1>
    <div id="result">Waiting...</div>
  </div>

  <script type="module">
    // Test if DOMContentLoaded fires correctly
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('result').textContent = 'DOMContentLoaded fired!';
      
      // Now try to import and init the app
      import('./js/main.js').then(module => {
        document.getElementById('result').textContent += ' + main.js loaded';
        if (window.App && typeof window.App.init === 'function') {
          document.getElementById('result').textContent += ' + App.init available';
          try {
            window.App.init();
            document.getElementById('result').textContent += ' + App.init succeeded';
          } catch (e) {
            document.getElementById('result').textContent += ' + App.init failed: ' + e.message;
          }
        }
      }).catch(e => {
        document.getElementById('result').textContent = 'main.js load failed: ' + e.message;
      });
    });
  </script>
</body>
</html>
