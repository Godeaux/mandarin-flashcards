<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theme Function Test</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="test-output">
    <h1>Theme Function Test</h1>
    <div id="log"></div>
  </div>

  <script type="module">
    const logDiv = document.getElementById('log');
    function log(msg) {
      logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
      console.log(msg);
    }
    
    function error(msg, err) {
      logDiv.innerHTML += `<div style="color: red;">❌ ${msg}: ${err.message}</div>`;
      console.error(msg, err);
    }
    
    // Wait a bit for the app to initialize
    setTimeout(async () => {
      try {
        log('Waiting for app to initialize...');
        await new Promise(r => setTimeout(r, 2000));
        
        log('Looking for theme button...');
        const themeButton = document.getElementById('btn-theme');
        
        if (!themeButton) {
          log('Theme button not found!');
          return;
        }
        
        log('Found theme button: "' + themeButton.textContent + '"');
        log('Button classes: ' + themeButton.className);
        log('Button parent: ' + themeButton.parentElement.tagName);
        
        // Check current theme
        const currentTheme = document.documentElement.getAttribute('data-theme');
        log('Current theme: ' + currentTheme);
        
        // Try to click the button
        log('Attempting to click theme button...');
        try {
          themeButton.click();
          log('✅ Click() method succeeded');
          
          // Wait a moment and check if theme changed
          setTimeout(() => {
            const newTheme = document.documentElement.getAttribute('data-theme');
            log('Theme after click: ' + newTheme);
            if (newTheme !== currentTheme) {
              log('✅ Theme changed successfully!');
            } else {
              log('⚠️ Theme did not change after click');
            }
          }, 500);
          
        } catch (clickError) {
          error('Click() method failed', clickError);
        }
        
      } catch (e) {
        error('Test failed', e);
      }
    }, 3000);
  </script>
</body>
</html>
