<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Module Test</title>
</head>
<body>
  <h1>Module System Test</h1>
  <div id="output"></div>
  
  <script type="module">
    // Test 1: Basic import/export
    try {
      import('./js/config.js').then(module => {
        document.getElementById('output').innerHTML += '<p>✅ Config module loaded successfully</p>';
        document.getElementById('output').innerHTML += `<p>SERVER_URL: ${module.CONFIG.SERVER_URL}</p>`;
      }).catch(err => {
        document.getElementById('output').innerHTML += `<p>❌ Config module failed: ${err.message}</p>`;
      });
    } catch (e) {
      document.getElementById('output').innerHTML += `<p>❌ Import syntax error: ${e.message}</p>`;
    }
    
    // Test 2: Multiple imports
    Promise.all([
      import('./js/storage.js'),
      import('./js/deck.js'),
      import('./js/srs.js'),
      import('./js/audio.js'),
      import('./js/ui.js'),
      import('./js/main.js')
    ]).then(([storageMod, deckMod, srsMod, audioMod, uiMod, mainMod]) => {
      document.getElementById('output').innerHTML += '<p>✅ All modules loaded successfully</p>';
      document.getElementById('output').innerHTML += `<p>Storage module: ${typeof storageMod.Storage}</p>`;
      document.getElementById('output').innerHTML += `<p>Deck module: ${typeof deckMod.Deck}</p>`;
      document.getElementById('output').innerHTML += `<p>SRS module: ${typeof srsMod.SM2}</p>`;
      document.getElementById('output').innerHTML += `<p>Audio module: ${typeof audioMod.Audio}</p>`;
      document.getElementById('output').innerHTML += `<p>UI module: ${typeof uiMod.UI}</p>`;
      document.getElementById('output').innerHTML += `<p>Main module: ${typeof mainMod.default || 'unknown'}</p>`;
    }).catch(err => {
      document.getElementById('output').innerHTML += `<p>❌ Module loading failed: ${err.message}</p>`;
      console.error(err);
    });
  </script>
</body>
</html>
